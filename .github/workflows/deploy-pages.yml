name: Deploy dashboard to GitHub Pages

# Data 저장소(liskay93/Data, 비공개)의 output/ 산출물만 가져와 대시보드와 함께 GitHub Pages 에 배포한다.
# 필요한 설정
#   1) 저장소 Settings → Pages → Source: "GitHub Actions"
#   2) 저장소 Secrets → DATA_REPO_TOKEN : Data 저장소 Contents(Read) 권한이 있는 fine-grained PAT
on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Data 저장소의 브랜치/태그 (비우면 기본 브랜치)"
        required: false
        default: ""
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 07:30 KST (전날 22:30 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 기본 브랜치에서만 배포 (다른 브랜치 push 는 무시)
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check DATA_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret 이 없습니다. Data 저장소(Contents: Read) 권한의 fine-grained PAT 을 등록하세요."
            exit 1
          fi

      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout Data repository (output/ only)
        uses: actions/checkout@v4
        with:
          repository: liskay93/Data
          ref: ${{ github.event.inputs.data_ref || '' }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data
          sparse-checkout: output
          sparse-checkout-cone-mode: true

      - name: Assemble site
        run: |
          set -e
          test -f _data/output/manifest.json || { echo "::error::Data 저장소에 output/manifest.json 이 없습니다"; exit 1; }
          mkdir -p site/data
          cp index.html site/
          cp -r assets site/assets
          cp .nojekyll site/.nojekyll
          cp -r _data/output/. site/data/
          echo "series files: $(ls site/data/series | wc -l)"
          python3 - <<'PY'
          import json
          m = json.load(open('site/data/manifest.json', encoding='utf-8'))
          print('data as of', m['dates']['last'], '| series', len(m['series']), '| generated', m['generated_at'])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

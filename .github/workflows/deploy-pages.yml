name: Deploy dashboard to GitHub Pages

# Data 저장소(liskay93/Data, 비공개)의 output/ 산출물만 가져와 대시보드와 함께 GitHub Pages 에 배포한다.
# 필요한 설정
#   1) 저장소 Settings → Pages → Source: "GitHub Actions"
#   2) 저장소 Secrets → DATA_REPO_TOKEN : Data 저장소 Contents(Read) 권한이 있는 fine-grained PAT (만료일에 주의)
#   ※ 공개 저장소는 60일간 커밋 등 활동이 없으면 schedule 트리거가 자동 비활성화된다 (Actions 탭에서 재활성화).
#      안정적인 자동 갱신은 Data 저장소의 TEST_REPO_TOKEN + repository_dispatch 경로를 권장.
on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Data 저장소의 브랜치/태그 (비우면 기본 브랜치)"
        required: false
        default: ""
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 07:30 KST (전날 22:30 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 진행 중인 배포는 끝까지 완료 (GitHub Pages 스타터와 동일)

jobs:
  build:
    # 기본 브랜치에서만 배포 (다른 브랜치 push 는 무시)
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      DATA_REPO: liskay93/Data
    steps:
      - name: Check DATA_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret 이 없습니다. Data 저장소(Contents: Read) 권한의 fine-grained PAT 을 등록하세요."
            exit 1
          fi
          # 토큰 유효성(만료·권한) 확인 — 실패 원인을 분명히 남긴다
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${DATA_REPO}"; then
            echo "::error::DATA_REPO_TOKEN 으로 ${DATA_REPO} 저장소에 접근할 수 없습니다 (토큰 만료 또는 권한 부족). 토큰을 재발급해 Secret 을 갱신하세요."
            exit 1
          fi

      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout Data repository (output/ only)
        uses: actions/checkout@v4
        with:
          repository: liskay93/Data
          ref: ${{ github.event.inputs.data_ref || '' }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data
          sparse-checkout: output
          sparse-checkout-cone-mode: true

      - name: Assemble site
        run: |
          set -e
          test -f _data/output/manifest.json || { echo "::error::Data 저장소에 output/manifest.json 이 없습니다"; exit 1; }
          mkdir -p site/data
          cp index.html site/
          cp -r assets site/assets
          cp .nojekyll site/.nojekyll
          cp -r _data/output/. site/data/
          echo "series files: $(ls site/data/series | wc -l)"
          python3 - <<'PY'
          import json
          m = json.load(open('site/data/manifest.json', encoding='utf-8'))
          print('data as of', m['dates']['last'], '| series', len(m['series']), '| generated', m['generated_at'])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
